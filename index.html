<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ewerton Natan | Detona Ralph</title>
    <!-- Fontes e Estilos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/styles/reset.css">
    <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body>

    <div class="container">
        <!-- Painel Superior (Placar, Tempo e Vidas) -->
        <div class="menu">
            <div class="menu__item">
                <h2 class="menu-title">Tempo Restante</h2>
                <span id="time-left">60</span>
            </div>
            <div class="menu__item">
                <h2 class="menu-title">Sua Pontuação</h2>
                <span id="score">0</span>
            </div>
            <div class="menu__item">
                <h2 class="menu-title">Vidas</h2>
                <div class="menu__lives">
                    <img src="./src/assets/images/player.png" alt="Vida" height="30">
                    <span id="lives">x3</span>
                </div>
            </div>
        </div>

        <!-- Painel do Jogo / Tabuleiro -->
        <div class="panel">
            <div class="panel-row">
                <div class="square" id="1"></div>
                <div class="square" id="2"></div>
                <div class="square" id="3"></div>
            </div>
            <div class="panel-row">
                <div class="square" id="4"></div>
                <div class="square" id="5"></div>
                <div class="square" id="6"></div>
            </div>
            <div class="panel-row">
                <div class="square" id="7"></div>
                <div class="square" id="8"></div>
                <div class="square" id="9"></div>
            </div>
        </div>
    </div>

    <!-- Script Principal -->
    <script src="./src/scripts/engine.js"></script>
</body>
</html>
